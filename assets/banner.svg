<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="pulseCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="pulsePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .glow-orb-1 {
        animation: floatOrb1 10s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: floatOrb2 12s ease-in-out infinite alternate;
      }
      .glow-orb-3 {
        animation: floatOrb3 8s ease-in-out infinite alternate;
      }
      .pulse-line {
        stroke-dasharray: 8 12;
        animation: dashFlow 25s linear infinite;
      }
      .pulse-line-rev {
        stroke-dasharray: 6 10;
        animation: dashFlowRev 20s linear infinite;
      }
      .node-pulse {
        animation: pulseNode 3s ease-in-out infinite alternate;
      }
      .node-pulse-delayed {
        animation: pulseNode 3s ease-in-out 1.5s infinite alternate;
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
        100% { transform: translate(60px, 40px) scale(1.2); opacity: 0.6; }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1.1); opacity: 0.3; }
        100% { transform: translate(-50px, -30px) scale(0.9); opacity: 0.55; }
      }
      @keyframes floatOrb3 {
        0% { transform: translate(0px, 0px) scale(0.9); opacity: 0.25; }
        100% { transform: translate(40px, -40px) scale(1.15); opacity: 0.5; }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 400; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes dashFlowRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 400; }
      }
      @keyframes pulseNode {
        0% { transform: scale(1); filter: drop-shadow(0 0 2px #38bdf8); }
        100% { transform: scale(1.15); filter: drop-shadow(0 0 8px #818cf8); }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Animated Background Glow Orbs -->
  <g>
    <circle class="glow-orb-1" cx="150" cy="100" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.35" />
    <circle class="glow-orb-2" cx="1050" cy="300" r="160" fill="#8b5cf6" filter="url(#glow)" opacity="0.3" />
    <circle class="glow-orb-3" cx="600" cy="380" r="120" fill="#ec4899" filter="url(#glow)" opacity="0.25" />
    <circle class="glow-orb-1" cx="950" cy="80" r="100" fill="#06b6d4" filter="url(#glow)" opacity="0.25" />
  </g>

  <!-- Decorative Circuit/Network Background Lines -->
  <g opacity="0.25">
    <path class="pulse-line" d="M -50 80 Q 250 20, 450 110 T 900 70 T 1250 120" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="pulse-line-rev" d="M -50 320 Q 300 370, 600 290 T 1000 340 T 1250 280" fill="none" stroke="#c084fc" stroke-width="2" />
    <path class="pulse-line" d="M 100 0 L 100 400 M 300 0 L 300 400 M 900 0 L 900 400 M 1100 0 L 1100 400" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.4" />
  </g>

  <!-- Dynamic Network Graph Nodes in the background perimeter -->
  <g opacity="0.7">
    <!-- Left Integration Nodes -->
    <g transform="translate(110, 200)">
      <circle class="node-pulse" cx="0" cy="0" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
      <circle cx="0" cy="0" r="6" fill="#38bdf8" />
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="600">APIs</text>
    </g>
    <g transform="translate(80, 280)">
      <circle class="node-pulse-delayed" cx="0" cy="0" r="14" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#818cf8" />
      <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">iPaaS</text>
    </g>

    <!-- Right Integration Nodes -->
    <g transform="translate(1080, 180)">
      <circle class="node-pulse" cx="0" cy="0" r="18" fill="#1e293b" stroke="#c084fc" stroke-width="2.5" />
      <circle cx="0" cy="0" r="6" fill="#c084fc" />
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="600">Workflows</text>
    </g>
    <g transform="translate(1120, 270)">
      <circle class="node-pulse-delayed" cx="0" cy="0" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#38bdf8" />
      <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Agents</text>
    </g>
  </g>

  <!-- Foreground Main Branding & Typography (Clear & Fully Legible) -->
  <g>
    <!-- Category Pill Badge -->
    <g transform="translate(600, 75)">
      <rect x="-165" y="-16" width="330" height="32" rx="16" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="-135" cy="0" r="5" fill="#10b981" />
      <text x="-120" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">ENTERPRISE &amp; EMBEDDED INTEGRATIONS</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5" filter="url(#softGlow)">
      Developer Tool &amp; Ecosystem Integrations
    </text>

    <!-- Subtitle -->
    <text x="600" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" letter-spacing="0.2">
      Curated Directory of Cloud iPaaS, Embedded Connectors &amp; Workflow Orchestration
    </text>

    <!-- Feature Highlights / Tag Pills in Foreground -->
    <g transform="translate(600, 280)">
      <!-- Pill 1: Enterprise iPaaS -->
      <g transform="translate(-320, 0)">
        <rect x="-80" y="-18" width="160" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ Enterprise iPaaS</text>
      </g>
      <!-- Pill 2: Embedded iPaaS -->
      <g transform="translate(-110, 0)">
        <rect x="-90" y="-18" width="180" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#818cf8" text-anchor="middle">🧩 Embedded Connectors</text>
      </g>
      <!-- Pill 3: Workflow Automation -->
      <g transform="translate(115, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle">🔄 Workflow Automation</text>
      </g>
      <!-- Pill 4: Open Source -->
      <g transform="translate(325, 0)">
        <rect x="-75" y="-18" width="150" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">🌱 100% Open Source</text>
      </g>
    </g>

    <!-- Bottom Stat Line -->
    <text x="600" y="345" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">
      Verified Pricing Models • Exact Free Tier Limits • GitHub Social Star Metrics • Market Valuations
    </text>
  </g>
</svg>
